[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoalgo"
version = "0.1.0"
description = "Paper-trading-only crypto algorithmic trading research system"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
live-data = ["requests>=2.31"]
dev = ["pytest>=8", "requests>=2.31"]

[tool.setuptools.packages.find]
include = ["cryptoalgo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running stability tests"]
filterwarnings = ["ignore::DeprecationWarning"]
